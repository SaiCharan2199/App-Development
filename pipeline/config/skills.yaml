# Skills to detect in job descriptions.
#   name:     how the skill is stored and shown
#   category: group used for analytics (language, cloud, ...)
#   aliases:  other ways it is written (matched as whole words, any case)
#   exact_case: true = match aliases only in this exact capitalisation
#               (for short names that are also normal words)

skills:
  # ---- Programming languages ----
  - { name: Python,      category: language, aliases: [python] }
  - { name: SQL,         category: language, aliases: [sql] }
  - { name: Java,        category: language, aliases: [java] }
